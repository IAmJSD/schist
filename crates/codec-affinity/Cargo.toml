[package]
name = "schist-codec-affinity"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
schist-core.workspace = true
schist-color.workspace = true
miniz_oxide.workspace = true
ruzstd.workspace = true
# Placed images keep their original file (PNG/JPEG…) in the container;
# tiles marked "source-backed" decode from it.
image.workspace = true
# Text layers re-render through our text engine; the spec is stored the
# same way the type tool stores it, so imported text stays editable.
schist-text-engine.workspace = true
schist-vector.workspace = true
schist-adjustments.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true

[dev-dependencies]
# Geometry tests decode the embedded thumbnail — Affinity's own render
# of each fixture — and compare the import against it; the afdiff
# example composites imported documents for the same comparison.
image.workspace = true
schist-compositor.workspace = true
schist-layer-fx.workspace = true
