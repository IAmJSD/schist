[package]
name = "schist-codecs-common"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
schist-core.workspace = true
schist-plugin-api.workspace = true
schist-codec-affinity.workspace = true
anyhow.workspace = true
log.workspace = true
image.workspace = true
sha2 = "0.10"
schist-color.workspace = true
schist-colormgmt.workspace = true
schist-compositor.workspace = true
# Camera raws are pure Rust and use the same implementation on desktop
# and wasm.
schist-codec-raw.workspace = true

# HEIC rides on a dlopen'd libheif; a browser has neither dlopen nor a
# libheif to open, so the codec (and its loader) stay off the wasm build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading.workspace = true

[dev-dependencies]
crc32fast.workspace = true
moxcms = "0.8"
