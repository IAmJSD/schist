[workspace]
resolver = "2"
# Example plugins compile to wasm32-unknown-unknown, not the host target.
exclude = ["examples/plugins/sepia-filter", "examples/plugins/pgm-codec"]
members = [
    "crates/app",
    "crates/core",
    "crates/plugin-api",
    "crates/pixel-ops",
    "crates/compositor",
    "crates/color",
    "crates/codec-psd",
    "crates/vector",
    "crates/text-engine",
    "crates/adjustments",
    "crates/plugin-host-wasm",
    "crates/plugin-sdk",
    "crates/colormgmt",
    "plugins/codecs-common",
    "plugins/tools-basic",
    "plugins/tools-paint",
    "plugins/tools-select",
    "plugins/tools-transform",
    "plugins/tools-vector",
    "plugins/tools-type",
    "plugins/filters-core",
    "plugins/commands-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/infrawrench/photoslop"

[workspace.dependencies]
# internal
photoslop-core = { path = "crates/core" }
photoslop-plugin-api = { path = "crates/plugin-api" }
photoslop-pixel-ops = { path = "crates/pixel-ops" }
photoslop-compositor = { path = "crates/compositor" }
photoslop-color = { path = "crates/color" }
photoslop-codec-psd = { path = "crates/codec-psd" }
photoslop-vector = { path = "crates/vector" }
photoslop-text-engine = { path = "crates/text-engine" }
photoslop-adjustments = { path = "crates/adjustments" }
photoslop-plugin-host-wasm = { path = "crates/plugin-host-wasm" }
photoslop-plugin-sdk = { path = "crates/plugin-sdk" }
photoslop-colormgmt = { path = "crates/colormgmt" }
photoslop-codecs-common = { path = "plugins/codecs-common" }
photoslop-tools-basic = { path = "plugins/tools-basic" }
photoslop-tools-paint = { path = "plugins/tools-paint" }
photoslop-tools-select = { path = "plugins/tools-select" }
photoslop-tools-transform = { path = "plugins/tools-transform" }
photoslop-tools-vector = { path = "plugins/tools-vector" }
photoslop-tools-type = { path = "plugins/tools-type" }
photoslop-filters-core = { path = "plugins/filters-core" }
photoslop-commands-core = { path = "plugins/commands-core" }

# external
gpui = "0.2.2"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
rayon = "1.10"
smallvec = "1.13"
rustc-hash = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff"] }
byteorder = "1.5"
log = "0.4"
env_logger = "0.11"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
debug = 1
