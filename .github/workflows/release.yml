name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: schist-linux-x86_64
          - os: macos-latest
            artifact: schist-macos
          - os: windows-latest
            artifact: schist-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Work out the version
        shell: bash
        run: |
          set -eo pipefail
          # A tag build is named after its tag. A manual run has no tag to
          # read, so fall back to the version in the workspace manifest.
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          fi
          echo "packaging as $version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # clang and mold are required by the linker settings in .cargo/config.toml.
          sudo apt-get install -y libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev \
            clang mold

      - name: Build
        # The MCP server ships next to the app, so it is built in the same
        # invocation -- the two share nearly every dependency.
        run: cargo build --release -p schist-app -p schist-mcp

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libfuse2 || true
          curl -sSL -o /tmp/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          # appimage.sh writes straight into dist/, so dist/ has to exist
          # before it runs -- mksquashfs otherwise dies with "Could not create
          # destination file" and no AppImage is produced.
          mkdir -p dist
          APPIMAGETOOL=/tmp/appimagetool ./packaging/linux/appimage.sh
          cp target/release/schist dist/
          # The MCP server is headless and needs none of the AppImage's
          # runtime, so it ships as a plain binary rather than inside it.
          cp target/release/schist-mcp dist/

      - name: Set up the signing keychain (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -eo pipefail
          if [ -z "${MACOS_CERT_P12_BASE64}" ]; then
            echo "No MACOS_CERT_P12_BASE64 secret; this build will be unsigned."
            exit 0
          fi

          CERT_PATH="$RUNNER_TEMP/developer_id_application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/schist-signing.keychain-db"
          # The keychain is thrown away with the runner, so a password only has
          # to be unguessable for the length of this job.
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(openssl rand -base64 24)}"

          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$MACOS_CERT_P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          # Prepend rather than replace: notarytool still wants the login
          # keychain on the search list.
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')

          # Let codesign use the key without prompting for the password.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Available code signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          if [ -z "$IDENTITY" ]; then
            echo "The certificate imported but holds no Developer ID Application identity." >&2
            exit 1
          fi
          echo "MACOS_CERT_NAME=$IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          # MACOS_CERT_NAME and MACOS_KEYCHAIN come from the keychain step
          # above; these three are what notarytool authenticates with.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ./packaging/macos/bundle.sh release
          # Upload the zip alone: actions/upload-artifact does not preserve the
          # bundle's permissions or symlinks, which would void the signature.
          rm -rf dist/Schist.app

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/schist.exe dist/
          # Shipped loose as well as inside the installer, for anyone
          # registering the MCP server without installing the app.
          Copy-Item target/release/schist-mcp.exe dist/
          # NSIS is not on the runner image. This step used to assume it was
          # and skip the installer in silence, so no release ever had one.
          choco install nsis --no-progress -y
          $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (-not (Test-Path $makensis)) {
            $found = Get-Command makensis -ErrorAction SilentlyContinue
            if (-not $found) { throw 'makensis missing after installing NSIS' }
            $makensis = $found.Source
          }
          # Quote the define: unquoted, PowerShell hands makensis the literal
          # "VERSION=$env:VERSION", and the ':' in the resulting OutFile makes
          # Windows write the installer into an NTFS alternate data stream,
          # leaving a 0-byte file behind that the release upload rejects.
          & $makensis "-DVERSION=$env:VERSION" packaging/windows/installer.nsi

          # That failure was silent last time, so confirm the installer is real.
          $out = "dist/Schist-$env:VERSION-setup.exe"
          if (-not (Test-Path $out)) { throw "installer not produced: $out" }
          if ((Get-Item $out).Length -eq 0) { throw "installer is empty: $out" }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
