name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: schist-linux-x86_64
          - os: macos-latest
            artifact: schist-macos
          - os: windows-latest
            artifact: schist-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # clang and mold are required by the linker settings in .cargo/config.toml.
          sudo apt-get install -y libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev \
            clang mold

      - name: Build
        run: cargo build --release -p schist-app

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libfuse2 || true
          curl -sSL -o /tmp/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          APPIMAGETOOL=/tmp/appimagetool ./packaging/linux/appimage.sh || true
          mkdir -p dist && cp target/release/schist dist/ 2>/dev/null || true

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_NAME: ${{ secrets.MACOS_CERT_NAME }}
          MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
        run: ./packaging/macos/bundle.sh release

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/schist.exe dist/
          # NSIS ships with the runner image; skip the installer if absent.
          if (Get-Command makensis -ErrorAction SilentlyContinue) {
            makensis -DVERSION=0.1.0 packaging/windows/installer.nsi
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
