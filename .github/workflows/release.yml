name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: schist-linux-x86_64
          - os: ubuntu-24.04-arm
            artifact: schist-linux-aarch64
          - os: macos-latest
            artifact: schist-macos
          - os: windows-latest
            artifact: schist-windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      # Compiled into the app by crates/app/src/crash.rs. In a fork, or any
      # repository without the secret, this arrives as an empty string --
      # which that code reads as "no DSN", so the build still succeeds and
      # simply has nothing to upload to and no preference to offer.
      SCHIST_SENTRY_DSN: ${{ secrets.SCHIST_SENTRY_DSN }}
      # Where the debug info goes. `vars`, not `secrets`: an org and project
      # slug are not secret, and putting them in `secrets` would only get
      # them masked out of the logs that diagnose a failed upload.
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      # The one switch for all of it: with no token every Sentry step below
      # is skipped and the release comes out as it did before any of this.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Work out the version
        shell: bash
        run: |
          set -eo pipefail
          # A tag build is named after its tag. A manual run has no tag to
          # read, so fall back to the version in the workspace manifest.
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          fi
          echo "packaging as $version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # clang and mold are required by the linker settings in .cargo/config.toml.
          sudo apt-get install -y libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev \
            clang mold
          # Links the Photoshop plug-in helpers, which are Windows
          # binaries even when Schist itself is not.
          sudo apt-get install -y gcc-mingw-w64

      # The .8bf helpers are binaries for the architectures a plug-in may
      # be built for, so they cannot come out of the same cargo build as
      # the app. They are staged first and carried inside it; every later
      # cargo build here, including the ones inside the packaging scripts,
      # reads SCHIST_BUNDLED_HELPERS and embeds them.
      - name: Stage the plug-in helpers
        if: runner.os != 'Windows'
        run: |
          make install-helpers DESTDIR="$PWD/target/helper-bundle/release" PROFILE=release
          echo "SCHIST_BUNDLED_HELPERS=$PWD/target/helper-bundle/release" >> "$GITHUB_ENV"

      # Without make: MSYS make would hand build.rs a /d/a/... path that a
      # native Windows build cannot open. The two names here are the same
      # ones the Makefile uses, and `Helper::file_name` pins both.
      - name: Stage the plug-in helpers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "$PWD/target/helper-bundle/release"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($h in @(
            @{ target = 'x86_64-pc-windows-msvc'; name = 'schist-8bf-helper-x86_64.exe' },
            @{ target = 'i686-pc-windows-msvc';   name = 'schist-8bf-helper-x86.exe' })) {
            rustup target add $h.target
            cargo build --release -p schist-plugin-host-8bf --bin schist-8bf-helper --target $h.target
            if ($LASTEXITCODE -ne 0) { throw "helper $($h.target) failed to build" }
            Copy-Item "target/$($h.target)/release/schist-8bf-helper.exe" "$stage/$($h.name)"
          }
          "SCHIST_BUNDLED_HELPERS=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        # The MCP server ships next to the app, so it is built in the same
        # invocation -- the two share nearly every dependency.
        run: cargo build --release -p schist-app -p schist-mcp

      # Installed from npm rather than the shell installer: it is the one
      # source with a binary for all four runners, arm64 Linux included.
      - name: Install sentry-cli
        if: env.SENTRY_AUTH_TOKEN != ''
        run: npm install -g @sentry/cli@2

      - name: Upload debug info to Sentry (Linux)
        if: runner.os == 'Linux' && env.SENTRY_AUTH_TOKEN != ''
        run: |
          # Before the Package step strips them. ELF carries DWARF inside
          # the executable, so this is the last moment it exists at all --
          # what ships keeps only its build id, and that id is what a crash
          # report is matched against these uploads on.
          #
          # schist-mcp is here even though only the app links the SDK: the
          # strip is destructive, so this is the one chance to keep anything
          # that could make sense of a fault in the server later.
          sentry-cli debug-files upload --include-sources \
            target/release/schist target/release/schist-mcp

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          # The release profile compiles with debug = 1 for readable local
          # backtraces, and ELF is the one format that embeds that info in the
          # executable itself -- strip it here so neither the AppImage payload
          # nor the loose binaries ship it. Symbols stay; only DWARF goes.
          strip --strip-debug target/release/schist target/release/schist-mcp
          # libfuse2: appimagetool. rpm: rpmbuild, for the .rpm.
          # libarchive-tools: bsdtar, which writes the .pkg.tar.zst's .MTREE.
          sudo apt-get install -y libfuse2 rpm libarchive-tools || true
          curl -sSL -o /tmp/appimagetool \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-$(uname -m).AppImage"
          chmod +x /tmp/appimagetool
          # appimage.sh writes straight into dist/, so dist/ has to exist
          # before it runs -- mksquashfs otherwise dies with "Could not create
          # destination file" and no AppImage is produced.
          mkdir -p dist
          APPIMAGETOOL=/tmp/appimagetool ./packaging/linux/appimage.sh
          # The .deb, .rpm and .pkg.tar.zst, from the same build.
          ./packaging/linux/packages.sh
          # Arch-suffixed: the x86_64 and aarch64 jobs publish into the same
          # release, and same-named assets would collide there.
          cp target/release/schist "dist/schist-linux-$(uname -m)"
          # The MCP server is headless and needs none of the AppImage's
          # runtime, so it ships as a plain binary rather than inside it.
          cp target/release/schist-mcp "dist/schist-mcp-linux-$(uname -m)"

      - name: Set up the signing keychain (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -eo pipefail
          if [ -z "${MACOS_CERT_P12_BASE64}" ]; then
            echo "No MACOS_CERT_P12_BASE64 secret; this build will be unsigned."
            exit 0
          fi

          CERT_PATH="$RUNNER_TEMP/developer_id_application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/schist-signing.keychain-db"
          # The keychain is thrown away with the runner, so a password only has
          # to be unguessable for the length of this job.
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(openssl rand -base64 24)}"

          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$MACOS_CERT_P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          # Prepend rather than replace: notarytool still wants the login
          # keychain on the search list.
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')

          # Let codesign use the key without prompting for the password.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Available code signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          if [ -z "$IDENTITY" ]; then
            echo "The certificate imported but holds no Developer ID Application identity." >&2
            exit 1
          fi
          echo "MACOS_CERT_NAME=$IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          # MACOS_CERT_NAME and MACOS_KEYCHAIN come from the keychain step
          # above; these three are what notarytool authenticates with.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ./packaging/macos/bundle.sh release
          # Upload the zip alone: actions/upload-artifact does not preserve the
          # bundle's permissions or symlinks, which would void the signature.
          rm -rf dist/Schist.app

      - name: Upload debug info to Sentry (macOS)
        if: runner.os == 'macOS' && env.SENTRY_AUTH_TOKEN != ''
        run: |
          # After packaging, not before: bundle.sh runs cargo again, and a
          # relink there would give the shipped binary a UUID no dSYM made
          # earlier would match. Signing is safe to have happened already --
          # codesign appends a signature and leaves LC_UUID alone.
          #
          # Nothing is stripped on macOS; the debug info simply lives in the
          # object files rather than the executable, and dsymutil is what
          # gathers it into a form that can be uploaded.
          dsymutil target/release/schist target/release/schist-mcp
          sentry-cli debug-files upload --include-sources \
            target/release/schist.dSYM target/release/schist-mcp.dSYM

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/schist.exe dist/
          # Shipped loose as well as inside the installer, for anyone
          # registering the MCP server without installing the app.
          Copy-Item target/release/schist-mcp.exe dist/
          # NSIS is not on the runner image. This step used to assume it was
          # and skip the installer in silence, so no release ever had one.
          choco install nsis --no-progress -y
          $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (-not (Test-Path $makensis)) {
            $found = Get-Command makensis -ErrorAction SilentlyContinue
            if (-not $found) { throw 'makensis missing after installing NSIS' }
            $makensis = $found.Source
          }
          # Quote the define: unquoted, PowerShell hands makensis the literal
          # "VERSION=$env:VERSION", and the ':' in the resulting OutFile makes
          # Windows write the installer into an NTFS alternate data stream,
          # leaving a 0-byte file behind that the release upload rejects.
          & $makensis "-DVERSION=$env:VERSION" packaging/windows/installer.nsi

          # That failure was silent last time, so confirm the installer is real.
          $out = "dist/Schist-$env:VERSION-setup.exe"
          if (-not (Test-Path $out)) { throw "installer not produced: $out" }
          if ((Get-Item $out).Length -eq 0) { throw "installer is empty: $out" }

      - name: Upload debug info to Sentry (Windows)
        if: runner.os == 'Windows' && env.SENTRY_AUTH_TOKEN != ''
        shell: pwsh
        run: |
          # MSVC keeps debug info in a .pdb beside the executable, so unlike
          # Linux nothing had to be stripped and the shipped .exe is exactly
          # what these describe. Matched rather than named: rustc derives the
          # .pdb name from the binary's, and the only .pdb files that land
          # directly in target/release are the two binaries' -- dependencies
          # and build scripts write theirs into deps/ and build/.
          $pdbs = Get-ChildItem target/release/*.pdb
          if (-not $pdbs) { throw 'no .pdb beside the release binaries' }
          sentry-cli debug-files upload --include-sources @($pdbs.FullName)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  # Registers the version the app reports under, so an uploaded crash lands
  # on a release with a commit range attached rather than on a bare string.
  # Separate from `build` because it happens once, not once per platform.
  sentry-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # set-commits works out what changed by reading the log; the
          # default shallow clone has none to read.
          fetch-depth: 0
      - name: Register the release with Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        run: |
          set -eo pipefail
          npm install -g @sentry/cli@2
          # The same name crash.rs sends events under, or they land nowhere
          # -- and it builds that from CARGO_PKG_VERSION, so this reads the
          # manifest rather than the tag. The two agree on a correctly cut
          # release; if they ever do not, the manifest is what shipped.
          release="schist@$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          sentry-cli releases new "$release"
          # Needs a repository integration configured on the Sentry side.
          # Without one this is the only part that fails, and it costs only
          # the commit list, so it must not take the release down with it.
          sentry-cli releases set-commits "$release" --auto --ignore-missing \
            || echo "no repository integration; release created without commits"
          sentry-cli releases finalize "$release"

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
